[package]
name = "trim-finder"
version = "1.0.0"
edition = "2021"
description = "Trim 内建原生扫描器（重复/大文件/空文件/AppData/大小统计）"

[dependencies]
blake3 = "1.8"
rayon = "1.11"
miniz_oxide = "0.8"

[[bin]]
name = "finder"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
